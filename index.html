    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    user-select: none;
  }

  .screen::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.18);
    z-index: 1;
  }

  .content { position: relative; z-index: 2; }

  /* -------- Login Card -------- */
  .login-card {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .avatar-circle {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    overflow: hidden;
    margin-bottom: 16px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.15);
  }

  .avatar-circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .username {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 16px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.65);
  }

  .pin-hint {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 10px;
  }
  .pin-hint svg { width: 30px; height: 30px; fill: rgba(255,255,255,0.92); margin-bottom: 8px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5)); }
  .pin-hint span {
    font-size: 19px;
    color: rgba(255,255,255,0.92);
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }

  .pin-wrap { width: 290px; position: relative; }

  .pin-input {
    width: 100%;
    height: 40px;
    background: rgba(255,255,255,0.12);
    border: none;
    border-radius: 4px;
    border-bottom: 2px solid #0078d4;
    color: #fff;
    font-size: 15px;
    letter-spacing: 3px;
    padding: 0 36px 0 16px;
    outline: none;
    transition: background .15s ease;
  }

  .pin-input:focus {
    background: rgba(255,255,255,0.18);
  }

  .pin-input::placeholder { color: rgba(255,255,255,0.7); letter-spacing: normal; }

  .eye-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.85;
  }
  .eye-btn svg { width: 18px; height: 18px; fill: #fff; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5)); }
  .eye-btn:hover { opacity: 1; }

  .signin-options {
    display: block;
    margin: 16px auto 0;
    font-size: 13px;
    color: #fff;
    background: none;
    border: none;
    cursor: pointer;
    opacity: 0.95;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
  .signin-options:hover { text-decoration: underline; }

  /* -------- Welcome Screen -------- */
  .welcome-card {
    display: none;
    flex-direction: column;
    align-items: center;
  }
  .welcome-card.show { display: flex; }

  .welcome-username {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 34px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.65);
  }

  /* Sequential loading dots (like real Windows sign-in) */
  .dots {
    display: flex;
    gap: 10px;
    height: 10px;
    margin-bottom: 30px;
  }
  .dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #fff;
    opacity: 0;
    animation: dotfade 1.8s ease-in-out infinite;
  }
  .dots span:nth-child(1){ animation-delay: 0s; }
  .dots span:nth-child(2){ animation-delay: .3s; }
  .dots span:nth-child(3){ animation-delay: .6s; }

  @keyframes dotfade {
    0%   { opacity: 0; }
    15%  { opacity: 1; }
    70%  { opacity: 1; }
    90%  { opacity: 0; }
    100% { opacity: 0; }
  }

  .welcome-text {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.3px;
    margin-bottom: 30px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.65);
  }

  .cancel-btn {
    background: none;
    border: none;
    color: #fff;
    font-size: 13px;
    opacity: 0;
    cursor: pointer;
    transition: opacity .3s ease;
  }
  .cancel-btn.show { opacity: 0.75; }
  .cancel-btn:hover { opacity: 1 !important; }

  /* -------- Sign-in options panel -------- */
  .options-panel {
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 28px 44px;
    border-radius: 8px;
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.15);
    min-width: 260px;
  }
  .options-panel.show { display: flex; }

  .options-title { font-size: 16px; margin-bottom: 20px; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }

  .back-btn {
    background: rgba(255,255,255,0.12);
    border: none;
    color: #fff;
    font-size: 13px;
    padding: 6px 18px;
    border-radius: 4px;
    cursor: pointer;
  }
  .back-btn:hover { background: rgba(255,255,255,0.2); }

  /* -------- Bottom-right status bar -------- */
  .taskbar-icons {
    position: absolute;
    right: 26px;
    bottom: 20px;
    display: flex;
    align-items: center;
    gap: 22px;
    z-index: 3;
  }
  .taskbar-icons .lang {
    font-size: 13px;
    letter-spacing: 0.5px;
    opacity: 0.95;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  .taskbar-icons svg { width: 20px; height: 20px; fill: #fff; opacity: 0.95; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6)); }
</style>

      <div class="options-title">Sign-in options</div>

  <!-- Bottom-right status bar: language / Wi-Fi / Ease of access / Power -->

    <span class="lang">ENG</span>
    <svg viewBox="0 0 24 24"><path d="M12 20a1.6 1.6 0 1 1 0-3.2 1.6 1.6 0 0 1 0 3.2zM6.3 14.3a8 8 0 0 1 11.4 0l-1.5 1.5a6 6 0 0 0-8.4 0l-1.5-1.5zM2.8 10.8a13 13 0 0 1 18.4 0l-1.5 1.5a11 11 0 0 0-15.4 0L2.8 10.8z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M12 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm8 7-6-1.7v3l4 1.2v2l-4-1v9h-2v-6h-1v6H9v-9l-4 1v-2l4-1.2v-3L3 9v-2l9 2.5L21 7v2z"/></svg>

  </div>
</div>

<script>
  const loginCard    = document.getElementById("loginCard");
  const welcomeCard  = document.getElementById("welcomeCard");
  const optionsPanel = document.getElementById("optionsPanel");

  const pinInput  = document.getElementById("pinInput");
  const signinBtn = document.getElementById("signinOptionsBtn");
  const cancelBtn = document.getElementById("cancelBtn");
  const backBtn   = document.getElementById("backBtn");
  const eyeBtn    = document.getElementById("eyeBtn");
  const eyeIcon   = document.getElementById("eyeIcon");

  let pinVisible = false;
  eyeBtn.addEventListener("click", () => {
    pinVisible = !pinVisible;
    pinInput.type = pinVisible ? "text" : "password";
    eyeIcon.innerHTML = pinVisible
      ? '<path d="M12 5c-7 0-11 7-11 7s.7 1.2 2 2.7L4.7 16A15.6 15.6 0 0 1 3 12s4-7 11-7c1.6 0 3 .3 4.3.8l-1.6 1.6C15.6 7.1 13.9 7 12 7c-2.8 0-5 2.2-5 5 0 .8.2 1.6.6 2.2l-1.5 1.5A9.6 9.6 0 0 1 3 12m9 5c7 0 11-7 11-7s-1.2-2.1-3.3-3.9l-1.5 1.5C19.6 8.9 20.6 10 21 12c0 0-4 7-11 7-1 0-1.9-.1-2.7-.4l1.6-1.6c.4.1.7.1 1.1.1 2.8 0 5-2.2 5-5 0-.4 0-.7-.1-1.1l3-3C19.7 9.6 21 12 21 12" /><path d="M2 3l19 19"/>'
      : '<path d="M12 5c-7 0-11 7-11 7s4 7 11 7 11-7 11-7-4-7-11-7zm0 12c-2.8 0-5-2.2-5-5s2.2-5 5-5 5 2.2 5 5-2.2 5-5 5zm0-8c-1.7 0-3 1.3-3 3s1.3 3 3 3 3-1.3 3-3-1.3-3-3-3z"/>';
    pinInput.focus();
  });

  // digits only
  pinInput.addEventListener("input", () => {
    pinInput.value = pinInput.value.replace(/[^0-9]/g, "").slice(0, 6);
    if (pinInput.value.length === 6) {
      goToWelcome();
    }
  });

  function goToWelcome() {
    loginCard.style.display = "none";
    welcomeCard.classList.add("show");
    cancelBtn.classList.remove("show");
    setTimeout(() => cancelBtn.classList.add("show"), 1200);
  }

  cancelBtn.addEventListener("click", () => {
    welcomeCard.classList.remove("show");
    loginCard.style.display = "flex";
    pinInput.focus();
  });

  signinBtn.addEventListener("click", () => {
    loginCard.style.display = "none";
    optionsPanel.classList.add("show");
  });

  backBtn.addEventListener("click", () => {
    optionsPanel.classList.remove("show");
    loginCard.style.display = "flex";
    pinInput.focus();
  });
</script>
